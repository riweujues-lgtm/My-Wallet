<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dompetku - Pengeluaran Bulanan</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-cover bg-center bg-no-repeat min-h-screen font-sans p-4 flex items-center justify-center bg-fixed" 
      style="background-image: url('https://i.ibb.co.com/FGJs3Zj/20260110-072737.jpg');">

    <audio id="bg-music" loop src="https://mp3tourl.com/audio/1780534910008-160f21d6-bef6-49d6-b594-a8ee5371ae0a.mp3"></audio>

    <div class="max-w-md w-full rounded-2xl shadow-2xl overflow-hidden p-6 relative border border-white/40 bg-cover bg-center text-gray-900 before:content-[''] before:absolute before:inset-0 before:bg-white/40 before:backdrop-blur-lg before:-z-10 isolate"
         style="background-image: url('https://i.ibb.co.com/FGJs3Zj/20260110-072737.jpg');">
        
        <button onclick="toggleMusic()" id="btn-music" class="absolute top-4 right-4 bg-white/95 px-4 py-2 rounded-full text-base shadow-md transition-all active:scale-95 cursor-pointer z-50 border border-gray-300 font-bold text-gray-800">
            🎵 Musik: Off
        </button>

        <h1 class="text-2xl font-black text-center text-gray-900 mb-6 mt-10 drop-shadow-md">💸 Pengeluaran Bulanan</h1>

        <!-- Ringkasan Statistik -->
        <div class="grid grid-cols-3 gap-2 text-center mb-6">
            <div class="bg-red-100/90 p-2 rounded-lg border border-red-300 shadow-xs">
                <p class="text-[11px] text-red-900 font-bold">Bulan Ini</p>
                <p id="total-monthly" class="text-xs font-black text-red-700 mt-1">Rp 0</p>
            </div>
            <div class="bg-orange-100/90 p-2 rounded-lg border border-orange-300 shadow-xs">
                <p class="text-[11px] text-orange-900 font-bold">Total Semua</p>
                <p id="total-all" class="text-xs font-black text-orange-700 mt-1">Rp 0</p>
            </div>
            <div class="bg-blue-100/90 p-2 rounded-lg border border-blue-300 shadow-xs">
                <p class="text-[11px] text-blue-900 font-bold">Total Transaksi</p>
                <p id="total-count" class="text-xs font-black text-blue-700 mt-1">0 item</p>
            </div>
        </div>

        <!-- Form Catat Pengeluaran -->
        <div class="mb-6 bg-white/70 p-4 rounded-xl border border-white/50 shadow-md">
            <label class="block text-xs font-bold text-gray-700 mb-1">Catat Pengeluaran Baru</label>
            <input type="text" id="desc" placeholder="Keterangan (misal: Beli Bakso, Bayar Listrik)" class="w-full p-2 border border-gray-400 rounded mb-2 text-sm bg-white font-medium focus:outline-none focus:ring-2 focus:ring-red-400">
            <input type="number" id="amount" placeholder="Nominal Pengeluaran (Rp)" class="w-full p-2 border border-gray-400 rounded mb-3 text-sm bg-white font-medium focus:outline-none focus:ring-2 focus:ring-red-400">
            
            <button onclick="addTransaction()" id="btn-submit" class="w-full bg-red-600 text-white p-2 rounded-lg font-black text-sm hover:bg-red-700 transition shadow-md cursor-pointer tracking-wide">Catat Pengeluaran</button>
        </div>

        <!-- Filter & Rincian Pengeluaran -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-2 border-b-2 border-red-500 pb-1">
                <h2 class="text-sm font-black text-red-900 flex items-center gap-1 drop-shadow-sm">📤 Detail Pengeluaran</h2>
                <select id="month-filter" onchange="updateUI()" class="text-xs p-1 border border-gray-400 rounded bg-white/90 font-bold text-gray-800 focus:outline-none">
                    <option value="all">Semua Bulan</option>
                </select>
            </div>
            
            <ul id="expense-list" class="divide-y divide-gray-100 max-h-48 overflow-y-auto space-y-1">
                <!-- Daftar item pengeluaran -->
            </ul>
        </div>

        <!-- Rekap Total Pengeluaran Per Bulan & Tombol Ekspor -->
        <div class="border-t border-dashed border-gray-400 pt-4 bg-white/70 p-3 rounded-xl shadow-md">
            <h3 class="text-xs font-black text-gray-700 uppercase tracking-wider mb-2 flex items-center gap-1">
                📊 Total Pengeluaran Per Bulan
            </h3>
            
            <div id="monthly-summary-list" class="space-y-1 text-sm text-gray-800 mb-3">
                <!-- Total bulanan akan direkap di sini -->
            </div>

            <button onclick="exportToCSV()" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-black text-xs hover:bg-emerald-700 transition shadow-md cursor-pointer flex items-center justify-center gap-1">
                📥 Ekspor Data ke CSV (Excel)
            </button>
        </div>

    </div>

    <script>
        let expenses = JSON.parse(localStorage.getItem('monthly_expenses')) || [];

        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('btn-music');
            
            if (music.paused) {
                music.play();
                btn.innerText = "🎵 Musik: On";
                btn.className = "absolute top-4 right-4 bg-green-500 px-4 py-2 rounded-full text-base shadow-md transition-all active:scale-95 cursor-pointer z-50 font-bold text-white border border-green-600";
            } else {
                music.pause();
                btn.innerText = "🎵 Musik: Off";
                btn.className = "absolute top-4 right-4 bg-white/95 px-4 py-2 rounded-full text-base shadow-md transition-all active:scale-95 cursor-pointer z-50 border border-gray-300 font-bold text-gray-800";
            }
        }

        function getMonthYearLabel(dateObj) {
            return dateObj.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
        }

        function updateUI() {
            const expenseList = document.getElementById('expense-list');
            const monthlySummaryList = document.getElementById('monthly-summary-list');
            const filterSelect = document.getElementById('month-filter');

            const totalMonthlyEl = document.getElementById('total-monthly');
            const totalAllEl = document.getElementById('total-all');
            const totalCountEl = document.getElementById('total-count');

            const monthlyTotals = {};
            let grandTotal = 0;

            expenses.forEach(item => {
                const monthLabel = item.monthLabel;
                if (!monthlyTotals[monthLabel]) {
                    monthlyTotals[monthLabel] = 0;
                }
                monthlyTotals[monthLabel] += item.amount;
                grandTotal += item.amount;
            });

            const currentFilter = filterSelect.value;
            filterSelect.innerHTML = '<option value="all">Semua Bulan</option>';
            Object.keys(monthlyTotals).forEach(month => {
                const opt = document.createElement('option');
                opt.value = month;
                opt.innerText = month;
                filterSelect.appendChild(opt);
            });
            filterSelect.value = currentFilter && filterSelect.querySelector(`option[value="${currentFilter}"]`) ? currentFilter : 'all';

            const selectedMonth = filterSelect.value;
            const filteredExpenses = selectedMonth === 'all' 
                ? expenses 
                : expenses.filter(item => item.monthLabel === selectedMonth);

            expenseList.innerHTML = '';
            if (filteredExpenses.length === 0) {
                expenseList.innerHTML = '<p class="text-xs text-gray-500 text-center py-3">Belum ada catatan pengeluaran.</p>';
            } else {
                filteredExpenses.forEach((t) => {
                    const globalIndex = expenses.indexOf(t);
                    const li = document.createElement('li');
                    li.className = 'py-2 text-xs bg-white/85 p-2 rounded-lg shadow-sm mb-1 flex flex-col relative border border-white/60 backdrop-blur-xs';
                    li.innerHTML = `
                        <div class="flex justify-between items-start pr-5">
                            <span class="text-gray-900 font-black break-all">${t.desc}</span>
                            <button onclick="deleteTransaction(${globalIndex})" class="text-gray-400 hover:text-red-600 absolute right-1 top-1">❌</button>
                        </div>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-[10px] text-gray-600 font-bold">${t.dateStr} (${t.time})</span>
                            <span class="text-red-700 font-black text-sm">
                                Rp ${t.amount.toLocaleString('id-ID')}
                            </span>
                        </div>
                    `;
                    expenseList.appendChild(li);
                });
            }

            monthlySummaryList.innerHTML = '';
            const monthKeys = Object.keys(monthlyTotals);
            if (monthKeys.length === 0) {
                monthlySummaryList.innerHTML = '<p class="text-xs text-gray-500 text-center py-1">Belum ada rekap bulanan.</p>';
            } else {
                monthKeys.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'flex justify-between text-xs font-medium py-1 border-b border-gray-200/60 last:border-0';
                    div.innerHTML = `
                        <span class="text-gray-800 font-bold">${m}:</span>
                        <span class="font-extrabold text-red-700">Rp ${monthlyTotals[m].toLocaleString('id-ID')}</span>
                    `;
                    monthlySummaryList.appendChild(div);
                });
            }

            const currentMonthLabel = getMonthYearLabel(new Date());
            const thisMonthTotal = monthlyTotals[currentMonthLabel] || 0;

            totalMonthlyEl.innerText = `Rp ${thisMonthTotal.toLocaleString('id-ID')}`;
            totalAllEl.innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;
            totalCountEl.innerText = `${expenses.length} item`;

            localStorage.setItem('monthly_expenses', JSON.stringify(expenses));
        }

        function addTransaction() {
            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);

            if (!desc || isNaN(amount) || amount <= 0) {
                return alert('Harap isi keterangan dan nominal dengan benar!');
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const monthLabel = getMonthYearLabel(now);
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const newRecord = { 
                desc, 
                amount, 
                type: 'expense', 
                dateStr, 
                monthLabel, 
                time: timeStr 
            };

            expenses.unshift(newRecord);
            updateUI();

            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';
        }

        function deleteTransaction(index) {
            if(confirm('Hapus catatan pengeluaran ini?')) {
                expenses.splice(index, 1);
                updateUI();
            }
        }

        // Fungsi Ekspor Data ke File CSV
        function exportToCSV() {
            if (expenses.length === 0) {
                return alert('Belum ada data pengeluaran untuk diekspor!');
            }

            // UTF-8 BOM agar Excel dapat membaca karakter bahasa Indonesia / tanda baca dengan rapi
            let csvContent = "\uFEFF";
            csvContent += "Tanggal;Jam;Bulan & Tahun;Keterangan;Nominal (Rp)\n";

            expenses.forEach(item => {
                const descClean = `"${item.desc.replace(/"/g, '""')}"`;
                csvContent += `${item.dateStr};${item.time};${item.monthLabel};${descClean};${item.amount}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            
            const today = new Date().toISOString().slice(0, 10);
            link.setAttribute('href', url);
            link.setAttribute('download', `Pengeluaran_Bulanan_${today}.csv`);
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        updateUI();
    </script>
</body>
</html>
