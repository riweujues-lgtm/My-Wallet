<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dompetku - Auto Google Sheets</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-cover bg-center bg-no-repeat min-h-screen font-sans p-4 flex items-center justify-center bg-fixed" 
      style="background-image: url('https://i.ibb.co.com/FGJs3Zj/20260110-072737.jpg');">

    <audio id="bg-music" loop src="https://mp3tourl.com/audio/1780534910008-160f21d6-bef6-49d6-b594-a8ee5371ae0a.mp3"></audio>

    <div class="max-w-md w-full rounded-2xl shadow-2xl overflow-hidden p-6 relative border border-white/40 bg-cover bg-center text-gray-900 before:content-[''] before:absolute before:inset-0 before:bg-white/40 before:backdrop-blur-lg before:-z-10 isolate"
         style="background-image: url('https://i.ibb.co.com/FGJs3Zj/20260110-072737.jpg');">
        
        <button onclick="toggleMusic()" id="btn-music" class="absolute top-4 right-4 bg-white/95 px-4 py-2 rounded-full text-base shadow-md transition-all active:scale-95 cursor-pointer z-50 border border-gray-300 font-bold text-gray-800">
            🎵 Musik: Off
        </button>

        <h1 class="text-2xl font-black text-center text-gray-900 mb-6 mt-10 drop-shadow-md">💰 DompetKu Cloud</h1>

        <div class="grid grid-cols-3 gap-2 text-center mb-6">
            <div class="bg-green-100/90 p-2 rounded-lg border border-green-300 shadow-xs">
                <p class="text-xs text-green-900 font-bold">Pemasukan</p>
                <p id="total-income" class="text-sm font-black text-green-700">Rp 0</p>
            </div>
            <div class="bg-red-100/90 p-2 rounded-lg border border-red-300 shadow-xs">
                <p class="text-xs text-red-900 font-bold">Pengeluaran</p>
                <p id="total-expense" class="text-sm font-black text-red-700">Rp 0</p>
            </div>
            <div class="bg-blue-100/90 p-2 rounded-lg border border-blue-300 shadow-xs">
                <p class="text-xs text-blue-900 font-bold">Saldo</p>
                <p id="total-balance" class="text-sm font-black text-blue-700">Rp 0</p>
            </div>
        </div>

        <div class="mb-6 bg-white/70 p-4 rounded-xl border border-white/50 shadow-md">
            <input type="text" id="desc" placeholder="Keterangan transaksi (misal: Jajan bakso)" class="w-full p-2 border border-gray-400 rounded mb-2 text-sm bg-white font-medium focus:outline-none focus:ring-2 focus:ring-blue-400">
            <input type="number" id="amount" placeholder="Nominal (Rp)" class="w-full p-2 border border-gray-400 rounded mb-2 text-sm bg-white font-medium focus:outline-none focus:ring-2 focus:ring-blue-400">
            <select id="type" class="w-full p-2 border border-gray-400 rounded mb-3 text-sm bg-white font-medium focus:outline-none focus:ring-2 focus:ring-blue-400">
                <option value="income">Pemasukan (+)</option>
                <option value="expense">Pengeluaran (-)</option>
            </select>
            <button onclick="addTransaction()" id="btn-submit" class="w-full bg-blue-600 text-white p-2 rounded-lg font-black text-sm hover:bg-blue-700 transition shadow-md cursor-pointer tracking-wide">Catat Transaksi</button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-6">
            <div>
                <h2 class="text-sm font-black text-green-900 mb-2 border-b-2 border-green-500 pb-1 flex items-center gap-1 drop-shadow-sm">📥 Pemasukan</h2>
                <ul id="income-list" class="divide-y divide-gray-100 max-h-48 overflow-y-auto space-y-1">
                    </ul>
            </div>
            
            <div>
                <h2 class="text-sm font-black text-red-900 mb-2 border-b-2 border-red-500 pb-1 flex items-center gap-1 drop-shadow-sm">📤 Pengeluaran</h2>
                <ul id="expense-list" class="divide-y divide-gray-100 max-h-48 overflow-y-auto space-y-1">
                    </ul>
            </div>
        </div>

        <div class="border-t border-dashed border-gray-400 pt-4 bg-white/70 p-3 rounded-xl shadow-md">
            <h3 class="text-xs font-black text-gray-600 uppercase tracking-wider mb-2">📋 Rincian Transaksi Anda</h3>
            <div class="space-y-1 text-sm text-gray-800 font-medium">
                <div class="flex justify-between">
                    <span>Total Item Pemasukan:</span>
                    <span id="count-income" class="font-bold text-green-700">0 kali</span>
                </div>
                <div class="flex justify-between">
                    <span>Total Item Pengeluaran:</span>
                    <span id="count-expense" class="font-bold text-red-700">0 kali</span>
                </div>
                <div class="flex justify-between pt-1">
                    <span>Total Uang yang Dipakai:</span>
                    <span id="rincian-used" class="font-extrabold text-red-700">Rp 0</span>
                </div>
                <hr class="border-gray-300 my-1">
                <div class="flex justify-between text-base font-black text-gray-900 pt-1">
                    <span>Sisa Saldo Bersih:</span>
                    <span id="rincian-saldo">Rp 0</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx-NGeAN7PYFSfiTgNGwRSLeGDIBK9dwilcfBBM_2xznqGOLFfejUpNr17XMt8zL6Z9Dw/exec";

        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('btn-music');
            
            if (music.paused) {
                music.play();
                btn.innerText = "🎵 Musik: On";
                btn.className = "absolute top-4 right-4 bg-green-500 px-4 py-2 rounded-full text-base shadow-md transition-all active:scale-95 cursor-pointer z-50 font-bold text-white border border-green-600";
            } else {
                music.pause();
                btn.innerText = "🎵 Musik: Off";
                btn.className = "absolute top-4 right-4 bg-white/95 px-4 py-2 rounded-full text-base shadow-md transition-all active:scale-95 cursor-pointer z-50 border border-gray-300 font-bold text-gray-800";
            }
        }

        function updateUI() {
            const incomeList = document.getElementById('income-list');
            const expenseList = document.getElementById('expense-list');
            
            const totalIncomeEl = document.getElementById('total-income');
            const totalExpenseEl = document.getElementById('total-expense');
            const totalBalanceEl = document.getElementById('total-balance');
            
            const countIncomeEl = document.getElementById('count-income');
            const countExpenseEl = document.getElementById('count-expense');
            const rincianUsedEl = document.getElementById('rincian-used');
            const rincianSaldoEl = document.getElementById('rincian-saldo');

            incomeList.innerHTML = '';
            expenseList.innerHTML = '';
            
            let income = 0;
            let expense = 0;
            let incomeCount = 0;
            let expenseCount = 0;

            transactions.forEach((t, index) => {
                const isIncome = t.type === 'income';
                
                const li = document.createElement('li');
                li.className = 'py-2 text-xs bg-white/85 p-2 rounded-lg shadow-sm mb-1 flex flex-col relative group border border-white/60 backdrop-blur-xs';
                li.innerHTML = `
                    <div class="flex justify-between items-start pr-4">
                        <span class="text-gray-900 font-black break-all">${t.desc}</span>
                        <button onclick="deleteTransaction(${index})" class="text-gray-500 hover:text-red-500 absolute right-1 top-1">❌</button>
                    </div>
                    <span class="text-[10px] text-gray-600 mt-0.5 font-bold">${t.date} ${t.time}</span>
                    <span class="${isIncome ? 'text-green-700' : 'text-red-700'} font-black mt-1 text-right text-sm">
                        Rp ${t.amount.toLocaleString('id-ID')}
                    </span>
                `;

                if (isIncome) {
                    income += t.amount;
                    incomeCount++;
                    incomeList.appendChild(li);
                } else {
                    expense += t.amount;
                    expenseCount++;
                    expenseList.appendChild(li);
                }
            });

            const balance = income - expense;
            
            totalIncomeEl.innerText = `Rp ${income.toLocaleString('id-ID')}`;
            totalExpenseEl.innerText = `Rp ${expense.toLocaleString('id-ID')}`;
            totalBalanceEl.innerText = `Rp ${balance.toLocaleString('id-ID')}`;
            
            countIncomeEl.innerText = `${incomeCount} kali`;
            countExpenseEl.innerText = `${expenseCount} kali`;
            rincianUsedEl.innerText = `Rp ${expense.toLocaleString('id-ID')}`;
            rincianSaldoEl.innerText = `Rp ${balance.toLocaleString('id-ID')}`;
            
            if (balance < 0) {
                rincianSaldoEl.className = "font-black text-red-700 text-base";
            } else {
                rincianSaldoEl.className = "font-black text-blue-700 text-base";
            }
            
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        function addTransaction() {
            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const type = document.getElementById('type').value;
            const btnSubmit = document.getElementById('btn-submit');

            if (!desc || isNaN(amount)) return alert('Harap isi keterangan dan nominal dengan benar!');

            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            const newRecord = { desc, amount, type, date: dateStr, time: timeStr };

            transactions.push(newRecord);
            updateUI();

            document.getElementById('desc').value = '';
            document.getElementById('amount').value = '';

            btnSubmit.innerText = "Mengirim ke Google Sheets...";
            btnSubmit.disabled = true;

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(newRecord),
                headers: { "Content-Type": "text/plain;charset=utf-8" }
            })
            .then(response => {
                btnSubmit.innerText = "Catat Transaksi";
                btnSubmit.disabled = false;
            })
            .catch(error => {
                console.error("Gagal mengirim ke cloud:", error);
                btnSubmit.innerText = "Catat Transaksi";
                btnSubmit.disabled = false;
                alert("Data aman di HP, tapi gagal masuk Google Sheets. Cek internet Anda.");
            });
        }

        function deleteTransaction(index) {
            if(confirm('Hapus catatan dari tampilan web? (Data di Google Sheets tetap aman)')) {
                transactions.splice(index, 1);
                updateUI();
            }
        }

        updateUI();
    </script>
</body>
</html>
